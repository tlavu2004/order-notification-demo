spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=0
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=0
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      cors:
        allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}