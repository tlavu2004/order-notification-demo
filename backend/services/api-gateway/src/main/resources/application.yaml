spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=0

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
